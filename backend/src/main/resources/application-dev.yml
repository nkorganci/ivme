# YALNIZ YEREL GELİŞTİRME (profil: dev). Yönetici parolası kaynak kodda tutulmaz.
server:
  servlet:
    session:
      cookie:
        secure: ${YKS_COOKIE_SECURE:false}

spring:
  datasource:
    url: ${YKS_DB_URL:jdbc:postgresql://localhost:5432/ivme}
    username: ${YKS_DB_KULLANICI:root}
    password: ${YKS_DB_SIFRE:root}

app:
  dev-auto-user: ${YKS_DEV_OGRENCI:nazile}
  images:
    dir: ${YKS_RESIM_KLASORU:../ornek-veri/resimler}   # mvn spring-boot:run, backend\ klasöründen çalışır
  topic-pdfs:
    catalog-dir: ${YKS_KONU_PDF_KATALOGU:../veri/ogm-konu-pdf-katalog/entries}
    source-dir: ${YKS_OGM_PDF_KAYNAGI:../../kaynaklar/ogm-materyal}
  admin:
    username: ${YKS_ADMIN_KULLANICI:ivmeadmin}
    email: ${YKS_ADMIN_EPOSTA:root@localhost}
    password: ${YKS_ADMIN_SIFRE:}                      # sadece açıkça verilirse yeni hesap oluşturur
  sample-data: ${YKS_ORNEK_VERI:../ornek-veri/sorular.csv}   # soru tablosu boşsa içe aktarılır

logging:
  level:
    com.hedefyks: DEBUG
