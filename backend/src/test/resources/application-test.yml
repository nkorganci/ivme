# testler/backend-test.ps1 creates and removes the temporary ivme_test database.
spring:
  datasource:
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
    url: ${YKS_TEST_DB_URL:jdbc:postgresql://localhost:5432/ivme_test}
    username: ${YKS_DB_KULLANICI:root}
    password: ${YKS_DB_SIFRE:root}

app:
  images:
    dir: ../ornek-veri/resimler
  admin:
    username: root
    email: root@localhost
    password: root
  sample-data: ""
  tutor:
    models:
      enabled: false   # testler modele bağlanmaz; yönlendirici testi ağ geçidini sahte bileşenle değiştirir
